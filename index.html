const Flame = (p) => <Icon {...p}><path d="M12 2s5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 1-3s-1 4 2 5c0-3 2-4 2-7 0-2-1-3-1-3 4 1 6 4 6 8a7 7 0 0 1-14 0c0-5 5-7 5-10z" /></Icon>;

const AppleIcon = ({ className = "w-4 h-4" }) =>
<svg viewBox="0 0 24 24" className={className} fill="currentColor" aria-hidden="true">
    <path d="M16.365 1.43c0 1.14-.467 2.27-1.218 3.087-.808.881-2.114 1.55-3.196 1.466-.13-1.117.45-2.286 1.171-3.04.815-.85 2.214-1.49 3.243-1.513zM20.5 17.25c-.6 1.36-.89 1.97-1.66 3.18-1.07 1.66-2.59 3.73-4.46 3.74-1.66.02-2.09-1.08-4.35-1.07-2.26.01-2.73 1.09-4.39 1.07-1.87-.02-3.31-1.89-4.38-3.55C-.91 16.99-1.21 11.86 1.6 9.05c1.04-1.06 2.55-1.73 3.93-1.73 1.66 0 2.71 1.07 4.08 1.07 1.33 0 2.14-1.07 4.06-1.07 1.27 0 2.62.69 3.59 1.85-3.16 1.73-2.65 6.24.74 8.08z" />

const Logo = () =>
<a href="#top" className="flex items-center gap-2.5 group">
    <span className="rounded-[10px] h-10 w-10 overflow-hidden flex items-center justify-center shadow-lg shadow-purple-900/30">

/* ------------------------------------------------------------------ */
/* BlurText – word/letter stagger, IntersectionObserver triggered      */
/* ------------------------------------------------------------------ */
function BlurText({
  text,
  as: Tag = "h1",
  splitBy = "word",
  delay = 200, // ms per element
  startDelay = 0, // ms before first element
  direction = "bottom",
  className = "",
  once = true
}) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            setInView(true);
            if (once) io.disconnect();
          } else if (!once) {
            setInView(false);
          }
        });
      },
      { threshold: 0.2 }
    );
    io.observe(el);
    return () => io.disconnect();
  }, [once]);

  const parts = useMemo(() => {
    // Defensive: pull a string out of `text`. React children can be strings,
    // numbers, arrays of strings, or JSX — we only safely split actual strings.
    const toStr = (v) => {
      if (v == null) return "";
      if (typeof v === "string") return v;
      if (typeof v === "number") return String(v);
      if (Array.isArray(v)) return v.map(toStr).join("");
      // React element or other object — last resort, try its children
      if (v.props && v.props.children != null) return toStr(v.props.children);
      return "";
    };
    const str = toStr(text);
    if (splitBy === "letter") return [...str];
    return str.split(/(\s+)/);
  }, [text, splitBy]);

  const yFrom = direction === "bottom" ? 50 : -50;

  return (
    <Tag ref={ref} className={className}>
      {parts.map((part, i) => {
        if (/^\s+$/.test(part)) return <span key={`ws-${i}`}>{part}</span>;
        return (
          <motion.span
            key={`p-${i}`}
            style={{ display: "inline-block", willChange: "transform, filter, opacity" }}
            initial={{ filter: "blur(10px)", opacity: 0, y: yFrom }}
            animate={
            inView ?
            {
              filter: ["blur(10px)", "blur(5px)", "blur(0px)"],
              opacity: [0, 0.5, 1],
              y: [yFrom, -5, 0]
            } :
            { filter: "blur(10px)", opacity: 0, y: yFrom }
            }
            transition={{
              duration: 0.7,
              times: [0, 0.6, 1],
              ease: [0.2, 0.7, 0.2, 1],
              delay: (startDelay + i * delay) / 1000
            }}>
            
            {part}
          </motion.span>);

      })}
    </Tag>);

}

/* ------------------------------------------------------------------ */
/* Reveal helper (blur-in, on mount or in view)                        */
/* ------------------------------------------------------------------ */
function Reveal({ children, delay = 0, y = 20, className = "", as = "div" }) {
  const Comp = motion[as] || motion.div;
  return (
    <Comp
      className={className}
      initial={{ filter: "blur(10px)", opacity: 0, y }}
      animate={{ filter: "blur(0px)", opacity: 1, y: 0 }}
      transition={{ duration: 0.6, delay, ease: [0.2, 0.7, 0.2, 1] }}>
      
      {children}
    </Comp>);

}

function RevealOnView({ children, delay = 0, y = 30, className = "" }) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      (entries) => entries.forEach((e) => e.isIntersecting && (setInView(true), io.disconnect())),
      { threshold: 0.15 }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return (
    <motion.div
      ref={ref}
      className={className}
      initial={{ filter: "blur(10px)", opacity: 0, y }}
      animate={inView ? { filter: "blur(0px)", opacity: 1, y: 0 } : {}}
      transition={{ duration: 0.7, delay, ease: [0.2, 0.7, 0.2, 1] }}>
      
      {children}
    </motion.div>);

}

/* ------------------------------------------------------------------ */
/* Video background w/ graceful fallback                                */
/* ------------------------------------------------------------------ */
function VideoBg({ src, poster, className = "", desaturate = false, fit = "cover", style = {} }) {
  const ref = useRef(null);
  const [ok, setOk] = useState(true);
  useEffect(() => {
    const v = ref.current;
    if (!v) return;
    const onErr = () => setOk(false);
    v.addEventListener("error", onErr);
    // try play
    const p = v.play();
    if (p && p.catch) p.catch(() => {});
    return () => v.removeEventListener("error", onErr);
  }, []);
  return (
    <div className={`absolute inset-0 ${className}`} style={style}>
      {ok ?
      <video
        ref={ref}
        autoPlay
        loop
        muted
        playsInline

  { kind: "done", dur: 2800 }];


  const [i, setI] = useState(0);
  useEffect(() => {
    const t = setTimeout(() => setI((p) => (p + 1) % scenes.length), scenes[i].dur);
    return () => clearTimeout(t);
  }, [i]);
  const scene = scenes[i];

  return (
    <div className="relative mx-auto phone-stage" style={{ width: 320, height: 650 }}>
      <div className="phone-shadow" />
      <div
        className="phone-tilt relative w-full h-full rounded-[52px] p-[10px]"

        <span className="absolute -left-[3px] top-24 w-[3px] h-8 rounded-l bg-zinc-700" />
        <span className="absolute -left-[3px] top-40 w-[3px] h-14 rounded-l bg-zinc-700" />

        <div className="relative w-full h-full rounded-[42px] overflow-hidden bg-white">
          <div className="absolute left-1/2 -translate-x-1/2 top-2 w-24 h-7 rounded-full bg-black z-30" />

          <AnimatePresence mode="wait">
            <motion.div
              key={i + "-" + scene.kind}
              initial={{ opacity: 0, x: scene.kind === "done" ? 30 : scene.kind === "home" ? -30 : 0, scale: scene.kind === "prompt" ? 1 : 1.01 }}
              animate={{ opacity: 1, x: 0, scale: 1 }}
              exit={{ opacity: 0, x: scene.kind === "home" ? 30 : -30 }}
              transition={{ duration: 0.45, ease: [0.2, 0.7, 0.2, 1] }}
              className="absolute inset-0">
              
              {scene.kind === "home" && <HomeScreen />}
              {scene.kind === "prompt" &&
              <JournalScreen
                progress={scene.progress}
                prompt={scene.prompt}
                category={scene.category}
                typed={scene.typed}
                finished={scene.finished}
                showCount={scene.showCount} />

              }
              {scene.kind === "done" && <WellDoneScreen />}
            </motion.div>
          </AnimatePresence>
        </div>
      </div>
    </div>);

}
